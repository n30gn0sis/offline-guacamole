services:
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

  guacd:
    image: guacamole/guacd:${GUACD_TAG:-1.6.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4822' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_TAG:-1.6.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/guacamole/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [guac-net]

  nginx:
    image: nginx:${NGINX_TAG:-1.27-alpine}
    restart: unless-stopped
    depends_on:
      guacamole:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/guacamole/"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

networks:
  guac-net:
    driver: bridge

volumes:
  guac-db:
