# NOTE: the __*_IMAGE_REF__ markers below are placeholders in the repo copy
# of this file. build.sh's package_bundle() substitutes each one with the
# concrete repo:tag from versions.env when it assembles a bundle, so the
# shipped docker-compose.yml carries real image references and versions.env
# stays the single source of truth. Do not hardcode image references here.
#
# pull_policy: never is deliberate — this stack must run with no registry
# access at all. If an image is missing locally, compose fails immediately
# with a clear error instead of quietly reaching out to a registry (which
# would also hide exactly this class of packaging bug from build.sh
# --selftest on a connected build machine).
services:
  postgres:
    image: __POSTGRES_IMAGE_REF__
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

  guacd:
    image: __GUACD_IMAGE_REF__
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      # The guacd image is busybox-only: no bash, so no /dev/tcp. busybox nc
      # is present and `-z` reports 0 for an open port, 1 for a closed one
      # (verified against the pinned 1.6.0 image).
      test: ["CMD-SHELL", "busybox nc -z 127.0.0.1 4822"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

  guacamole:
    image: __GUACAMOLE_IMAGE_REF__
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/guacamole/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [guac-net]

  nginx:
    image: __NGINX_IMAGE_REF__
    pull_policy: never
    restart: unless-stopped
    depends_on:
      guacamole:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/guacamole/"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [guac-net]

networks:
  guac-net:
    driver: bridge

volumes:
  guac-db:
